# Local smoke test (no Kubernetes):
#   docker compose -f deploy/docker/docker-compose.yml up --build
services:
  fieldsense-api:
    image: ${DOCKERHUB_USERNAME:-fieldsense}/fieldsense-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      FieldSense__AcsMock: "true"
      FieldSense__AdminEmail: admin@ndorbit.co.nz
      FieldSense__AdminPassword: ChangeMeAdmin!
      FieldSense__JwtKey: local-compose-jwt-key-change-me-32chars
      FieldSense__CorsOrigin: http://127.0.0.1:43180,http://localhost:43180
      FieldSense__AcsSenderAddress: DoNotReply@ndorbit.co.nz
      ConnectionStrings__Default: Data Source=/data/fieldsense.db
    volumes:
      - api-data:/data
    ports:
      - "15088:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  fieldsense-web:
    image: ${DOCKERHUB_USERNAME:-fieldsense}/fieldsense-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      # Browser calls the host-published API port (compose bridge may be locked down on some hosts).
      # Kubernetes images keep VITE_API_BASE empty and nginx proxies /api → fieldsense-api.
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:15088}
    ports:
      - "43180:80"
    depends_on:
      fieldsense-api:
        condition: service_healthy

volumes:
  api-data:
