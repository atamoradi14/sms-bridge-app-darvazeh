server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static SPA only. In Kubernetes, Ingress routes /api → fieldsense-api.
    # Local compose sets VITE_API_BASE to the published API host port.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
