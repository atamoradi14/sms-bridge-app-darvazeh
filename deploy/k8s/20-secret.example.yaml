# EXAMPLE ONLY — do not commit real secrets.
# Copy to 20-secret.yaml (gitignored) or create with:
#   kubectl -n sms-forwarder create secret generic fieldsense-secrets \
#     --from-literal=FieldSense__AdminPassword='...' \
#     --from-literal=FieldSense__JwtKey='...' \
#     --from-literal=FieldSense__AcsConnectionString='...'
apiVersion: v1
kind: Secret
metadata:
  name: fieldsense-secrets
  namespace: sms-forwarder
  labels:
    app.kubernetes.io/part-of: fieldsense
type: Opaque
stringData:
  FieldSense__AdminPassword: "ChangeMeAdmin!"
  FieldSense__JwtKey: "replace-with-long-random-secret-at-least-32-chars"
  FieldSense__AcsConnectionString: ""
