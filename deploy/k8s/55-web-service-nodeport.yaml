# Optional NodePort for clusters without Ingress (laptop / bare metal).
# Excluded by default. Enable with --include-nodeport / -IncludeNodePort.
# On ravand-worker-01 you can use Ingress instead and delete this file.
apiVersion: v1
kind: Service
metadata:
  name: fieldsense-web-nodeport
  namespace: darvazeh
  labels:
    app.kubernetes.io/name: fieldsense-web
    app.kubernetes.io/part-of: fieldsense
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fieldsense-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30431
---
apiVersion: v1
kind: Service
metadata:
  name: fieldsense-api-nodeport
  namespace: darvazeh
  labels:
    app.kubernetes.io/name: fieldsense-api
    app.kubernetes.io/part-of: fieldsense
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fieldsense-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30088
