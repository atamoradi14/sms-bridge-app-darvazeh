apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldsense-api
  namespace: sms-forwarder
  labels:
    app.kubernetes.io/name: fieldsense-api
    app.kubernetes.io/part-of: fieldsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldsense-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldsense-api
        app.kubernetes.io/part-of: fieldsense
    spec:
      securityContext:
        fsGroup: 1654
      containers:
        - name: api
          image: DOCKERHUB_USERNAME/fieldsense-api:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fieldsense-config
            - secretRef:
                name: fieldsense-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fieldsense-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: fieldsense-api
  namespace: sms-forwarder
  labels:
    app.kubernetes.io/name: fieldsense-api
    app.kubernetes.io/part-of: fieldsense
spec:
  selector:
    app.kubernetes.io/name: fieldsense-api
  ports:
    - name: http
      port: 8080
      targetPort: http
