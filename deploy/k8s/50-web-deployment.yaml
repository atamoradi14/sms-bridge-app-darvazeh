apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldsense-web
  namespace: sms-forwarder
  labels:
    app.kubernetes.io/name: fieldsense-web
    app.kubernetes.io/part-of: fieldsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldsense-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldsense-web
        app.kubernetes.io/part-of: fieldsense
    spec:
      containers:
        - name: web
          image: DOCKERHUB_USERNAME/fieldsense-web:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: web-config
          configMap:
            name: fieldsense-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: fieldsense-web
  namespace: sms-forwarder
  labels:
    app.kubernetes.io/name: fieldsense-web
    app.kubernetes.io/part-of: fieldsense
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fieldsense-web
  ports:
    - name: http
      port: 80
      targetPort: http
