name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: apply (full YAML) or set-image (roll images only)
        required: true
        default: set-image
        type: choice
        options: [apply, set-image]
      tag:
        description: Docker image tag
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ inputs.tag }}
      DEPLOY_MODE: ${{ inputs.mode }}
      KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG }}
      SSH_KEY: ${{ secrets.RAVAND_WORKER_SSH_KEY }}
      WORKER_SSH_ADDRESS: ${{ secrets.RAVAND_WORKER_SSH_HOST }}
      DEPLOY_ENV_B64: ${{ secrets.DARVAZEH_ENV_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment credentials
        run: |
          test -n "$DEPLOY_ENV_B64" || { echo 'Missing DARVAZEH_ENV_B64 (base64 root .env)' >&2; exit 1; }
          umask 077
          printf '%s' "$DEPLOY_ENV_B64" | base64 -d > .env
          python3 scripts/deployment-env.py check
          if [ -z "$KUBECONFIG_B64" ]; then
            test -n "$SSH_KEY" && test -n "$WORKER_SSH_ADDRESS" || {
              echo 'Set KUBE_CONFIG or both RAVAND_WORKER_SSH_KEY and RAVAND_WORKER_SSH_HOST' >&2
              exit 1
            }
          fi

      - name: Deploy using ravand context
        if: env.KUBECONFIG_B64 != ''
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          bash scripts/deploy.sh "$DEPLOY_MODE" --local --context ravand --tag "$IMAGE_TAG"

      - name: Deploy via SSH to ravand-worker-01
        if: env.KUBECONFIG_B64 == ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Keep a stable alias; the secret supplies the actual user@host address.
          [[ "$WORKER_SSH_ADDRESS" =~ ^[a-zA-Z0-9_-]+@[a-zA-Z0-9.-]+$ ]] || {
            echo 'RAVAND_WORKER_SSH_HOST must be user@host' >&2; exit 1;
          }
          printf 'Host ravand-worker-01\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n' \
            "${WORKER_SSH_ADDRESS#*@}" "${WORKER_SSH_ADDRESS%@*}" > ~/.ssh/config
          bash scripts/deploy.sh "$DEPLOY_MODE" --ssh ravand-worker-01 --context ravand --tag "$IMAGE_TAG"
